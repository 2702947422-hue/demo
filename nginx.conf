# 容器内 nginx：只托管 dist/ 里的静态文件（x2.1 vs x2.1-flash 对比 demo）。
# 域名 ad.xxx.com 与 HTTPS 由宿主机的反向代理负责，转发到 127.0.0.1:9399 → 容器 80。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # 内部使用，不让搜索引擎收录。
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # 打包后的 JS 文件名带内容哈希，可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 页面本身不缓存，更新后刷新即可看到新版本。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
