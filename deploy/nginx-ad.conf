# ad.xxx.com：x2.1 vs x2.1-flash 对比 demo（纯静态页面，不需要后端）。
# 前面的反向代理负责域名与 HTTPS，并转发到这里：proxy_pass http://127.0.0.1:9399;
# 本配置只在本机 9399 端口提供 dist/ 里的静态文件。
#
# 用法：把 npm run build 生成的 dist/ 里的文件上传到 /var/www/ad-demo/，
#       把本文件放到 /etc/nginx/conf.d/ad-demo.conf，然后 nginx -t && nginx -s reload。
# 内部使用，不设访问密码；API Key 由使用者在页面里自己填，只存在各自浏览器里。

server {
    # 只监听本机，外部只能经前面的反向代理（HTTPS）访问。
    listen 127.0.0.1:9399;
    server_name _;

    root /var/www/ad-demo;
    index index.html;
    charset utf-8;

    # 不让搜索引擎收录。
    add_header X-Robots-Tag "noindex, nofollow" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    # 打包后的 JS 文件名带内容哈希，可以长期缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # 页面本身不缓存，更新后刷新即可看到新版本。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
